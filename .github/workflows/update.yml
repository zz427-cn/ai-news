name: Update AI news

on:
  schedule:
    # 数据源每天北京 08:00 出稿。UTC 午夜是 GitHub 调度洪峰，延迟不可控，
    # 故设三个冗余触发点（北京 08:23 / 08:40 / 09:10），首个成功即可；重复跑无变化时自动跳过
    - cron: "23 0 * * *"
    - cron: "40 0 * * *"
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and build
        run: python3 scripts/update.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "daily: $(date -u +%F) update"
          git push
